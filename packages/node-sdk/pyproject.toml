[project]
name = "groovy-node-sdk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "groovy-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groovy"]

[tool.uv.sources]
groovy-schema = { workspace = true }
