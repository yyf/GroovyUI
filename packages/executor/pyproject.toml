[project]
name = "groovy-executor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "groovy-schema",
    "groovy-node-sdk",
    "numpy>=2.0",
    "soundfile>=0.12",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groovy"]

[tool.uv.sources]
groovy-schema = { workspace = true }
groovy-node-sdk = { workspace = true }

[project.optional-dependencies]
loudness = ["pyloudnorm>=0.1"]
