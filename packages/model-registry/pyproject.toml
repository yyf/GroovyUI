[project]
name = "groovy-model-registry"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
groovy-model = "groovy.registry.cli:main"
groovy-registry = "groovy.registry.registry_cli:main"
groovy-install = "groovy.registry.pack_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groovy"]

[tool.hatch.build.targets.wheel.force-include]
"src/groovy/registry/seed.json" = "groovy/registry/seed.json"
"src/groovy/registry/bundles/hello_weights.bin" = "groovy/registry/bundles/hello_weights.bin"
