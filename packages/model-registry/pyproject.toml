[project]
name = "groovy-model-registry"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groovy"]

[tool.hatch.build.targets.wheel.force-include]
"src/groovy/registry/seed.json" = "groovy/registry/seed.json"
