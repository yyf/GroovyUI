[project]
name = "groovy-schema"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groovy"]

[project.entry-points."groovy.packages"]
schema = "groovy.schema"
