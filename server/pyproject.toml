[project]
name = "groovy-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "groovy-schema",
    "groovy-node-sdk",
    "groovy-executor",
    "groovy-nodes-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
]

[project.scripts]
groovy-server = "groovy.server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groovy"]

[tool.uv.sources]
groovy-schema = { workspace = true }
groovy-node-sdk = { workspace = true }
groovy-executor = { workspace = true }
groovy-nodes-core = { workspace = true }
