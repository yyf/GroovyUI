[project]
name = "groovy-ui"
version = "0.1.0"
description = "ComfyUI for audio — modular synthesis with AI models as nodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/schema",
    "packages/node-sdk",
    "packages/executor",
    "packages/model-registry",
    "nodes/core",
    "nodes/ai",
    "server",
]

[tool.uv.sources]
groovy-schema = { workspace = true }
groovy-node-sdk = { workspace = true }
groovy-executor = { workspace = true }
groovy-nodes-core = { workspace = true }
groovy-nodes-ai = { workspace = true }
groovy-model-registry = { workspace = true }
groovy-server = { workspace = true }

[dependency-groups]
dev = [
    "groovy-schema",
    "groovy-node-sdk",
    "groovy-executor",
    "groovy-nodes-core",
    "groovy-nodes-ai",
    "groovy-model-registry",
    "groovy-server",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]
inference = [
    "groovy-nodes-ai[inference]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/schema/src",
    "packages/node-sdk/src",
    "packages/executor/src",
    "nodes/core/src",
    "nodes/ai/src",
    "packages/model-registry/src",
    "server/src",
]
asyncio_mode = "auto"
markers = [
    "integration: hero real-inference / cold-machine tests (run with GROOVY_INFERENCE_STUB=0)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
