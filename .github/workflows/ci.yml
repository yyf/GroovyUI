name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: uv sync --all-packages --group dev
      # Video to Audio / MuxVideo / PreviewVideo need ffmpeg (not on the default runner PATH).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          if command -v pnpm >/dev/null 2>&1; then pnpm install; else cd apps/studio && npm install; fi
      - run: uv run pytest tests/ -q
        env:
          GROOVY_INFERENCE_STUB: "1"
      - run: uv run groovy-verify
      - run: |
          if command -v pnpm >/dev/null 2>&1; then pnpm --filter @groovy/studio test; else cd apps/studio && npm test; fi
      - run: |
          if command -v pnpm >/dev/null 2>&1; then pnpm lint:studio; else cd apps/studio && npm run lint; fi
